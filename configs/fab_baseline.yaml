# Phase-1 FAB baseline experiment (reproducibility standard sections 2-4).
# Loaded by src/experiment.py. Secrets (HF_TOKEN) are NOT stored here - read from env.
name: phase1_fab_baseline
benchmark: fab               # fab | mini
model: deepseek-ai/DeepSeek-V4-Flash
num_tasks: 50                # 0 = use all loaded questions
temperature: 0.0             # greedy / deterministic (declared per standard 3.3)
seeds: [42, 43, 44]          # >=3 independent runs; accuracy reported as mean +/- std
concurrency: 6               # ThreadPoolExecutor workers (HF-router safe per smoke test)
max_tokens: 1024
max_tool_calls: 50
# Judge (T2) is configured in src/config.py (T2_JUDGE_MODEL / T2_TEMPERATURE -> V4-Flash / 0).
